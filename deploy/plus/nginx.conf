# wise-plus on the shared AWS server: same as frontend/nginx.conf, but the API is "plus-api"
# (Wise's own API is called "api" on the network this container also joins).
server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 16m;
    # Security M5: what the pages may load (blocks injected scripts). Repeated in blocks that set their own headers.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://accounts.google.com https://checkout.razorpay.com https://connect.facebook.net; style-src 'self' 'unsafe-inline' https://accounts.google.com; img-src 'self' data: blob: https://*.googleusercontent.com https://*.gstatic.com https://*.razorpay.com https://*.facebook.com https://*.fbcdn.net; font-src 'self' data:; media-src 'self' blob:; connect-src 'self' https://accounts.google.com https://*.razorpay.com https://graph.facebook.com https://*.facebook.com; frame-src https://accounts.google.com https://*.razorpay.com https://*.facebook.com; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self' https://*.razorpay.com; frame-ancestors 'self'; report-uri /api/public/csp-report" always;

    location = /healthz { access_log off; return 200 "ok"; }

    # Live updates: a long-lived stream that must not be buffered.
    location ~ ^/api/(events|public/display/[^/]+/events)$ {
        proxy_pass http://plus-api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }
    # Bill scanning: big phone photos, and the AI reader can take up to a minute on a hard bill.
    location = /api/inventory/purchases/scan {
        proxy_pass http://plus-api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 120s;
    }
    location /api/ {
        proxy_pass http://plus-api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 60s;
    }
    location /uploads/ {
        proxy_pass http://plus-api:8000;
        expires 7d;
    }
    # Hashed build files never change; cache them for a year.
    location /assets/ { expires 1y; add_header Cache-Control "public, immutable";
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://accounts.google.com https://checkout.razorpay.com https://connect.facebook.net; style-src 'self' 'unsafe-inline' https://accounts.google.com; img-src 'self' data: blob: https://*.googleusercontent.com https://*.gstatic.com https://*.razorpay.com https://*.facebook.com https://*.fbcdn.net; font-src 'self' data:; media-src 'self' blob:; connect-src 'self' https://accounts.google.com https://*.razorpay.com https://graph.facebook.com https://*.facebook.com; frame-src https://accounts.google.com https://*.razorpay.com https://*.facebook.com; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self' https://*.razorpay.com; frame-ancestors 'self'; report-uri /api/public/csp-report" always;
        try_files $uri =404; }
    # Everything else is the single-page app.
    location / {
        add_header Cache-Control "no-cache";
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://accounts.google.com https://checkout.razorpay.com https://connect.facebook.net; style-src 'self' 'unsafe-inline' https://accounts.google.com; img-src 'self' data: blob: https://*.googleusercontent.com https://*.gstatic.com https://*.razorpay.com https://*.facebook.com https://*.fbcdn.net; font-src 'self' data:; media-src 'self' blob:; connect-src 'self' https://accounts.google.com https://*.razorpay.com https://graph.facebook.com https://*.facebook.com; frame-src https://accounts.google.com https://*.razorpay.com https://*.facebook.com; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self' https://*.razorpay.com; frame-ancestors 'self'; report-uri /api/public/csp-report" always;
        try_files $uri /index.html;
    }
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
